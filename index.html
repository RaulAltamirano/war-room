<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23ffc83d' d='M12 1.6l3.1 6.4 7 .95-5.1 4.9 1.25 6.95L12 17.4l-6.25 3.4L7 13.85 1.9 8.95l7-.95z'/%3E%3C/svg%3E">
<title>Bitácora de Guerras</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700;800;900&display=swap">
<style id="css">
/* Layout: noche de guerra — héroe con emblema 3D, KPIs, podio sobre pedestales, tarjetas de jugador, alertas y reservas */
:root{
  --sky:#130f2a;--sky-2:#22184a;--panel:#1e1a3c;--panel-hi:#2a2456;--line:#3a3272;
  --ink:#f6f2ff;--muted:#b4acd8;--gold:#ffc83d;--gold-deep:#b86e00;--elixir:#d257ff;
  --blue:#5aa7ff;--green:#5ee08a;--red:#ff6b5e;--stone:#5d5788;
  --font-display:"Lilita One","Arial Rounded MT Bold",system-ui,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,var(--sky-2),var(--sky) 70%) fixed,var(--sky);background-color:var(--sky);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:8px 120px;display:grid;gap:44px;position:relative}
h1,h2,h3{font-family:var(--font-display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.01em}
.toon{color:var(--ink);text-shadow:0 1px 0 #3b2f7a,0 2px 0 #33286c,0 3px 0 #2b2260,0 4px 0 #241c53,0 7px 12px rgba(0,0,0,.55)}
.toon-gold{color:var(--gold);text-shadow:0 1px 0 #d99400,0 2px 0 #c68500,0 3px 0 #a86e00,0 4px 0 #8a5900,0 7px 12px rgba(0,0,0,.55)}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:900;color:var(--gold)}
.sec-head{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:12px 20px;margin-bottom:18px}
.sec-head h2{font-size:clamp(1.5rem,3.6vw,2rem)}
.sec-head p{margin:6px 0 0;color:var(--muted);max-width:60ch}
.tnum{font-variant-numeric:tabular-nums}

/* Fondo animado */
.sky-fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.cloud{position:absolute;border-radius:50%;background:radial-gradient(closest-side,rgba(130,110,220,.22),transparent);filter:blur(6px)}
.c1{width:520px;height:160px;top:6%;left:-10%;animation:drift 48s linear infinite}
.c2{width:420px;height:130px;top:34%;left:60%;animation:drift 62s linear infinite reverse}
.c3{width:600px;height:180px;top:72%;left:10%;animation:drift 70s linear infinite}
.spark{position:absolute;width:10px;height:10px;background:var(--gold);clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:.55;animation:twinkle 3.2s ease-in-out infinite}
main,.savebar{position:relative;z-index:1}

/* Héroe */
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px;align-items:center;padding-top:24px}
.hero h1{font-size:clamp(2.4rem,8vw,4.6rem);line-height:.98}
.hero p{color:var(--muted);max-width:56ch;margin:14px 0 0;font-size:1.02rem}
.emblem{width:clamp(150px,26vw,250px);filter:drop-shadow(0 18px 24px rgba(0,0,0,.5));animation:bob 5s ease-in-out infinite}
.emblem .shine{animation:shine 4.5s ease-in-out infinite}
@media (max-width:640px){.hero{grid-template-columns:1fr;justify-items:start}.emblem{order:-1;width:140px}}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:26px}
.kpi{background:linear-gradient(180deg,var(--panel-hi),var(--panel));border:2px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 #110d27,0 14px 24px rgba(0,0,0,.35);display:grid;gap:2px;animation:rise .7s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i,0)*90ms)}
.kpi .v{font-family:var(--font-display);font-size:2.1rem;line-height:1.05}
.kpi .v small{font-size:1rem;color:var(--muted)}
.kpi .l{font-size:.8rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.meter{height:8px;border-radius:5px;background:#0f0b22;overflow:hidden;margin-top:6px;box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.meter i{display:block;height:100%;border-radius:5px;transform-origin:left;animation:grow 1.1s cubic-bezier(.2,.8,.2,1) both;animation-delay:.3s}

/* Podio */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:end}
.pod{display:grid;justify-items:center;gap:10px;min-width:0;animation:rise .8s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0)*140ms + 200ms)}
.medal{width:86px;height:86px;position:relative;display:grid;place-items:center;animation:bob 4s ease-in-out infinite;animation-delay:calc(var(--i,0)*-1.2s)}
.medal svg{position:absolute;inset:0;width:100%;height:100%}
.medal b{position:relative;font-family:var(--font-display);font-size:1.9rem;color:#5a3600;text-shadow:0 1px 0 #fff3b0}
.pod .who{font-family:var(--font-display);font-size:clamp(1.05rem,2.6vw,1.45rem);text-align:center;overflow-wrap:anywhere;line-height:1.1}
.pod .stars{display:flex;gap:2px}
.ped{width:100%;border-radius:14px 14px 6px 6px;position:relative;display:grid;place-items:center;align-content:center;gap:2px;padding:14px 8px;
  background:linear-gradient(180deg,#7b74b6 0,#5d5788 14%,#4a4473 100%);box-shadow:inset 0 -8px 0 rgba(0,0,0,.25),0 10px 0 #18132f,0 22px 30px rgba(0,0,0,.45)}
.ped::before{content:"";position:absolute;left:6px;right:6px;top:-10px;height:18px;border-radius:50%;background:linear-gradient(180deg,#a7a0e0,#7b74b6);box-shadow:0 2px 0 rgba(255,255,255,.15) inset}
.ped.r1{min-height:150px;background:linear-gradient(180deg,#ffd76a 0,#f0b02a 16%,#c98300 100%)}
.ped.r1::before{background:linear-gradient(180deg,#fff0a8,#ffcf4a)}
.ped .imp{position:relative;font-family:var(--font-display);font-size:1.9rem;line-height:1}
.ped .lbl{position:relative;font-size:.72rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.ped.r1 .imp,.ped.r1 .lbl{color:#4a2c00}
.ped.r2{min-height:122px}.ped.r3{min-height:100px}
.tie{display:inline-flex;align-items:center;gap:6px;background:rgba(255,200,61,.14);color:var(--gold);border:1px solid rgba(255,200,61,.4);font-weight:900;font-size:.8rem;padding:4px 12px;border-radius:999px}
@media (max-width:560px){.podium{gap:8px}.medal{width:64px;height:64px}.medal b{font-size:1.4rem}.ped .imp{font-size:1.4rem}}

/* Controles */
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:#0f0b22;border:2px solid var(--line);border-radius:14px;padding:4px}
.seg button{font:inherit;font-weight:900;font-size:.85rem;color:var(--muted);background:none;border:0;border-radius:10px;padding:7px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:linear-gradient(180deg,#ffd76a,#e9a514);color:#3f2500;box-shadow:0 3px 0 #9a6200}
.btn{font:inherit;font-weight:900;color:#3f2500;background:linear-gradient(180deg,#ffe07a,#f2b021);border:0;border-radius:12px;padding:10px 18px;cursor:pointer;box-shadow:0 4px 0 #9a6200,0 8px 16px rgba(0,0,0,.35);transition:transform .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6200}
.btn.ghost{background:var(--panel-hi);color:var(--ink);box-shadow:0 4px 0 #110d27}
.btn:disabled{opacity:.6;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:3px}

/* Tarjetas */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;perspective:1200px}
.card{position:relative;min-width:0;background:linear-gradient(180deg,var(--panel-hi),var(--panel) 60%);border:2px solid var(--line);border-radius:20px;padding:16px;display:grid;gap:14px;
  box-shadow:0 7px 0 #110d27,0 18px 30px rgba(0,0,0,.35);transform:rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .18s ease-out,border-color .2s;
  animation:rise .7s cubic-bezier(.2,.9,.3,1.25) both;animation-delay:calc(var(--i,0)*70ms)}
.card:hover{border-color:var(--gold)}
.card.top{border-color:rgba(255,200,61,.65)}
.card-top{display:flex;align-items:center;gap:12px;min-width:0}
.rank{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);font-size:1.3rem;background:radial-gradient(circle at 35% 30%,#8a83c9,#4a4473);box-shadow:0 3px 0 #18132f,inset 0 2px 0 rgba(255,255,255,.25)}
.rank.g1{background:radial-gradient(circle at 35% 30%,#fff2a8,#f0b02a 60%,#b77100);color:#4a2c00}
.who-box{min-width:0;flex:1}
.who-box h3{font-size:1.3rem;line-height:1.1;overflow-wrap:anywhere}
.role{display:inline-block;margin-top:4px;font-size:.68rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:#0f0b22;color:var(--muted)}
.role.L{color:var(--gold)}.role.C{color:var(--elixir)}.role.E{color:var(--blue)}
.impact{flex:none;width:64px;height:64px;position:relative;display:grid;place-items:center}
.impact svg{position:absolute;inset:0;transform:rotate(-90deg)}
.impact .ring{stroke-dasharray:var(--c) 999;animation:ring 1.2s cubic-bezier(.2,.8,.2,1) both;animation-delay:.25s}
.impact b{font-family:var(--font-display);font-size:1.05rem;line-height:1}
.impact small{position:absolute;bottom:-14px;font-size:.62rem;font-weight:900;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:#120e2a;border-radius:12px;padding:8px 10px;display:grid;gap:2px;min-width:0}
.stat .l{font-size:.66rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-family:var(--font-display);font-size:1.25rem;line-height:1.1}
.pos{color:var(--green)}.neg{color:var(--red)}
.st-row{display:flex;gap:2px;align-items:center}
.si{position:relative;width:22px;height:22px;flex:none}
.si svg{position:absolute;inset:0;width:100%;height:100%}
.si .fill{position:absolute;inset:0;overflow:hidden}
.si .fill svg{width:22px;height:22px}
.big .si{width:30px;height:30px}.big .si .fill svg{width:30px;height:30px}
.dist{display:grid;gap:6px}
.dist-l{display:flex;justify-content:space-between;font-size:.72rem;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#0f0b22;box-shadow:inset 0 2px 3px rgba(0,0,0,.6)}
.stack i{height:100%;transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) both;animation-delay:.35s;box-shadow:inset 0 3px 0 rgba(255,255,255,.22)}
.k3{background:var(--gold)}.k2{background:var(--elixir)}.k1{background:var(--blue)}.k0{background:var(--stone)}
.km{background:repeating-linear-gradient(135deg,var(--red) 0 5px,#a83a30 5px 10px)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;font-weight:800;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}

/* Alertas y reservas */
.alerts{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.alert{display:flex;align-items:center;gap:12px;background:linear-gradient(180deg,#3a1a2c,#2a1324);border:2px solid #6e2c3c;border-radius:16px;padding:12px 14px;min-width:0}
.alert .n{flex:none;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--font-display);font-size:1.4rem;background:var(--red);color:#2a0b08;box-shadow:0 3px 0 #8f2a22}
.alert b{display:block;overflow-wrap:anywhere}
.alert small{color:#e6b3b8}
.bench{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:800;font-size:.9rem;overflow-wrap:anywhere;max-width:100%}
.chip .role{margin:0}
main>section{scroll-margin-top:72px}
.topnav{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:10px 6px;margin-inline:-6px;background:rgba(19,15,42,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);border-radius:0 0 14px 14px}
.topnav::-webkit-scrollbar{display:none}
.topnav a{flex:none;color:var(--muted);text-decoration:none;font-weight:900;font-size:.85rem;padding:6px 12px;border-radius:999px;border:2px solid transparent}
.topnav a:hover,.topnav a:focus-visible{color:var(--ink);border-color:var(--line);outline:none}
.thc{display:inline-block;font-size:.66rem;font-weight:900;letter-spacing:.04em;padding:2px 7px;border-radius:6px;vertical-align:middle;white-space:nowrap;box-shadow:inset 0 -2px 0 rgba(0,0,0,.25)}
.thc.t1{background:#7a4b26;color:#ffe0c0}.thc.t2{background:#6b6f86;color:#f1f3ff}.thc.t3{background:#b9c3dd;color:#1e2240}.thc.t4{background:linear-gradient(180deg,#ffe07a,#e9a514);color:#3f2500}.thc.t5{background:linear-gradient(180deg,#e58bff,#9b3ad6);color:#fff}
.pod .thc{margin-top:-4px}
.empty-box{background:var(--panel);border:2px dashed var(--line);border-radius:16px;padding:20px;color:var(--muted)}
.wtabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;scrollbar-width:thin}
.wtabs button{flex:none;display:grid;gap:2px;text-align:left;font:inherit;color:var(--muted);background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:8px 14px;cursor:pointer;min-width:120px}
.wtabs button b{color:var(--ink);font-weight:900;font-size:.9rem}
.wtabs button small{font-weight:800;font-size:.78rem}
.wtabs button[aria-selected="true"]{border-color:var(--gold);background:linear-gradient(180deg,#3a2f6e,var(--panel));box-shadow:0 4px 0 #110d27}
.res{font-weight:900}.res.win{color:var(--green)}.res.loss{color:var(--red)}.res.tie{color:var(--blue)}
.res.big{font-family:var(--font-display);font-weight:400;font-size:1.05rem;padding:2px 10px;border-radius:8px;background:#0f0b22}
.wsum{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 14px;margin-bottom:12px}
.wsum-t{font-family:var(--font-display);font-size:1.15rem}
.wsum-act{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pillx{display:inline-block;font-size:.8rem;font-weight:900;padding:3px 10px;border-radius:999px;background:#0f0b22;color:var(--muted)}
.pillx.bad{background:rgba(255,107,94,.15);color:var(--red)}
.btn.danger{color:var(--red)}
.lg-top{margin-bottom:10px}
.dot-pro{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(94,224,138,.2);flex:none}
.tbl-wrap{overflow-x:auto;background:var(--panel);border:2px solid var(--line);border-radius:18px;box-shadow:0 7px 0 #110d27,0 18px 30px rgba(0,0,0,.3)}
table.wl{border-collapse:separate;border-spacing:0;width:100%;min-width:920px;font-variant-numeric:tabular-nums}
.wl th,.wl td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
.wl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;background:#16122f;position:sticky;top:0}
.wl th:nth-child(2),.wl td:nth-child(2){text-align:left}
.wl .sticky{position:sticky;left:0;z-index:1;background:var(--panel);box-shadow:6px 0 8px -6px rgba(0,0,0,.6)}
.wl th.sticky{background:#16122f;z-index:2}
.wl tbody tr:hover td{background:#252050}
.wl tbody tr:hover td.sticky{background:#252050}
.wl tr.top td.rank{color:var(--gold)}
.wl td.rank{font-family:var(--font-display);font-size:1.05rem;color:var(--muted);text-align:center;width:2.5em}
.th-btn{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit;background:none;border:0;padding:0;cursor:pointer}
.wl th[aria-sort]{color:var(--gold)}
.pbtn{display:inline-flex;align-items:center;gap:8px;font:inherit;font-weight:900;color:var(--ink);background:none;border:0;padding:2px 0;cursor:pointer;max-width:240px}
.pbtn .pn{overflow:hidden;text-overflow:ellipsis}
.caret{display:inline-block;color:var(--muted);transition:transform .2s}
.pbtn[aria-expanded="true"] .caret{transform:rotate(90deg);color:var(--gold)}
.wl .si{width:15px;height:15px}.wl .si .fill svg{width:15px;height:15px}
.wl td .st-row{display:inline-flex;vertical-align:middle}
.sub-n{margin-left:6px;font-weight:800;color:var(--muted);font-size:.85rem}
.impbar{display:inline-block;width:48px;height:7px;border-radius:4px;background:#0f0b22;margin-right:8px;vertical-align:middle;overflow:hidden}
.impbar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--gold));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.hist{display:inline-flex;gap:3px}
.hist i{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-style:normal;font-size:.72rem;font-weight:900;color:#1a1438}
.hist .h3{background:var(--gold)}.hist .h2{background:var(--green)}.hist .h1{background:var(--blue)}.hist .h0{background:var(--stone);color:var(--ink)}
.hist .h-none{border:2px dashed var(--line)}
.hist .h-miss{box-shadow:inset 0 -4px 0 var(--red)}
.wl tr.detail td{background:#120e2a;white-space:normal;text-align:left;padding:14px}
.wl tr.open td{background:#201b45}
.wds{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wd{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:12px;display:grid;gap:8px}
.wd-k{font-size:.82rem;font-weight:800;color:var(--muted)}
.pro{gap:12px}
.pro-n{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-display);background:#0f0b22;color:var(--gold)}
.pro-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pro .pillx{margin-top:4px}
.sub-p{margin:-4px 0 10px}
.clan-sec{display:grid;gap:16px}
.banner{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;padding:24px 24px 24px 12px;border-radius:24px;overflow:hidden;
  background:radial-gradient(500px 260px at 15% 20%,rgba(212,42,70,.28),transparent 70%),linear-gradient(135deg,#2c2160,#1a1438 60%,#241a4c);border:2px solid var(--line);box-shadow:0 8px 0 #110d27,0 22px 40px rgba(0,0,0,.45)}
.banner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 22px);pointer-events:none}
.pennant{width:clamp(140px,22vw,210px);filter:drop-shadow(0 14px 18px rgba(0,0,0,.5));position:relative;z-index:1}
.pennant .cloth{transform-box:view-box;transform-origin:100px 26px;animation:sway 6s ease-in-out infinite}
.banner-info{display:grid;gap:12px;min-width:0;position:relative;z-index:1}
.clan-name{font-size:clamp(2.4rem,7vw,4rem);line-height:1;overflow-wrap:anywhere}
.tagrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
#clan-tag{user-select:all;letter-spacing:.06em;font-weight:900;font-size:1.05rem;background:#0f0b22;border:2px solid var(--line);border-radius:10px;padding:5px 12px}
.desc{margin:0;padding:12px 16px;border-left:4px solid var(--gold);background:rgba(15,11,34,.6);border-radius:0 12px 12px 0;font-size:1.02rem;max-width:62ch}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{font-size:.8rem;font-weight:900;padding:5px 12px;border-radius:999px;background:#0f0b22;border:2px solid var(--line);color:var(--muted)}
.pill.gold{color:var(--gold);border-color:rgba(255,200,61,.45);background:rgba(255,200,61,.1)}
.reqs{display:flex;flex-wrap:wrap;align-items:center;gap:8px}

function rec(s){var miss=s[4],mp=s[3];var pos=s[14]||(mp>0?Math.max(1,Math.round(miss*100/mp)):2);
 return {impact:s[0],avg:s[1],avgNew:s[2],missPct:mp,miss:miss,net:s[5],atk:s.slice(6,10),def:s.slice(10,14),pos:pos,used:pos-miss,stars:Math.round(s[1]*pos),trip:Math.round(s[6]*pos/100)}}
function agg(ws){
 var P={},order=[];
 ws.forEach(function(w){w.members.forEach(function(m){var p=P[m[0]];if(!p){p=P[m[0]]={n:m[0],r:m[1],g:0,pos:0,used:0,stars:0,trip:0,miss:0,net:0,impSum:0,def3:0,hist:{},last:null};order.push(m[0])}
  p.r=m[1];if(!m[2])return;var r=rec(m[2]);p.g++;p.pos+=r.pos;p.used+=r.used;p.stars+=r.stars;p.trip+=r.trip;p.miss+=r.miss;p.net+=r.net;p.impSum+=r.impact;p.def3+=r.def[0];p.hist[w.id]=r;p.last=r})});
 return order.map(function(k){var p=P[k];p.imp=p.g?p.impSum/p.g:0;p.avg=p.pos?p.stars/p.pos:0;p.d3=p.g?p.def3/p.g:0;return p});
}
function cmpOff(x,y){return (y.imp-x.imp)||(y.stars-x.stars)||(y.net-x.net)||(x.miss-y.miss)||x.n.localeCompare(y.n,'es')}
function sameP(a,b){return a.imp===b.imp&&a.stars===b.stars&&a.net===b.net&&a.miss===b.miss}

function trend(){
 var W=warsSorted(),H={};
 W.forEach(function(w){w.members.forEach(function(m){if(!m[2])return;(H[m[0]]=H[m[0]]||[]).push(rec(m[2]))})});
 var up=[],down=[],out=[];
 Object.keys(H).forEach(function(n){var h=H[n],pos=0,miss=0;h.forEach(function(r){pos+=r.pos;miss+=r.miss});
  if(miss>=2&&miss*2>=pos){out.push({n:n,miss:miss,pos:pos});return}
  if(h.length<2)return;
  var k=Math.min(2,h.length-1),rec2=h.slice(-k),prev=h.slice(0,h.length-k);
  var avg=function(a){var t=0;a.forEach(function(r){t+=r.impact});return t/a.length};
  var a0=avg(prev),a1=avg(rec2),d=Math.round(a1-a0);
  if(d>=10)up.push({n:n,d:d,from:Math.round(a0),to:Math.round(a1)});
  else if(d<=-10)down.push({n:n,d:d,from:Math.round(a0),to:Math.round(a1)});
 });
 up.sort(function(a,b){return b.d-a.d});down.sort(function(a,b){return a.d-b.d});out.sort(function(a,b){return b.miss-a.miss});
 return {up:up,down:down,out:out};
}

  (list.length?list.map(function(x){return '<div class="an-r"><span class="an-n">'+esc(x.n)+'</span>'+thChip(x.n)+'<span class="an-v tnum">'+fmt(x)+'</span></div>'}).join(''):'<p class="note an-e">'+empty+'</p>')+'</div>'}
 return '<section id="analisis" aria-labelledby="h-an"><div class="sec-head"><h2 id="h-an" class="toon">Análisis</h2><span class="hint">Últimas 2 guerras vs. anteriores</span></div><div class="ans">'+
 col('up','▲','Mejoraron',T.up,function(x){return '+'+x.d+' · '+x.from+' → '+x.to},'Nadie subió de forma clara.')+
 col('down','▼','Bajaron',T.down,function(x){return x.d+' · '+x.from+' → '+x.to},'Nadie bajó de forma clara.')+
 col('out','✕','Fuera de guerra',T.out,function(x){return x.miss+' de '+x.pos+' sin usar'},'Todos cumplen con sus ataques.')+
 '</div><p class="note an-foot">Fuera de guerra: dejó la mitad o más de sus ataques.</p></section>';
}
function render(){
 $('app').innerHTML=DEFS+nav()+hero()+podium()+warLog()+alerts()+lineup()+clanCard()+analysis();
}

$('app').addEventListener('click',function(ev){
 var b=ev.target.closest('[data-sortk],[data-act],[data-war],[data-row]');if(!b)return;
 if(b.dataset.act==='retry'){boot();return}
 if(b.dataset.sortk){tSort=b.dataset.sortk;render();return}
 if(b.dataset.war){selWar=b.dataset.war;openRow=null;render();return}
 if(b.dataset.row){openRow=openRow===b.dataset.row?null:b.dataset.row;render();return}
 if(b.dataset.act==='copy'){var t=S.clan.tag;var done=function(){b.textContent='Copiado'};
  try{navigator.clipboard.writeText(t).then(done,function(){selTag()})}catch(e){selTag()}}
});

boot();
})();
</script>
</body>
</html>
