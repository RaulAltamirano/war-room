name: Actualizar bitácora
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      enviar_informe:
        description: Enviar informe Discord ahora (Top 3, análisis, prospectos)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["index.html", "scripts/**", "tests/**", ".github/workflows/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: bitacora, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --test tests/
      - run: node scripts/fetch.mjs
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: "#2RGC02RYC"
      - run: node scripts/build.mjs
      - run: node scripts/discord-report.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SEND_REPORT: ${{ github.event.inputs.enviar_informe }}
      - run: node scripts/discord-monthly.mjs
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      - name: Commit si hay cambios
        run: |
          git config user.name "bitacora-bot"
          git config user.email "bitacora-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
            exit 0
          fi
          git commit -m "Datos actualizados $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rechazado, reintento $i…"
            sleep $((i * 3))
          done
          echo "No se pudo pushear tras rebase"
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
      - uses: actions/deploy-pages@v4
