name: Actualizar bitácora
# Trigger: cron, workflow_dispatch, push a scripts|tests|index|workflow
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      enviar_informe:
        description: Enviar informe Discord ahora (Top 3, análisis, prospectos)
        type: boolean
        default: false
      enviar_pase:
        description: Enviar reglas del pase mensual (para anclar; sin ganador)
        type: boolean
        default: false
      enviar_prospectos:
        description: Enviar alineación de prospectos (iniciar próxima guerra)
        type: boolean
        default: false
      enviar_zonas_ban:
        description: Enviar aviso Discord zona roja / zona gris (disciplina)
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ["index.html", "scripts/**", "tests/**", ".github/workflows/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: bitacora, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: node --test tests/
      - run: node scripts/fetch.mjs
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: "#2RGC02RYC"
      - run: node scripts/build.mjs
      - run: node scripts/discord-report.mjs
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SEND_REPORT: ${{ github.event.inputs.enviar_informe }}
      - run: node scripts/discord-monthly.mjs
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SEND_MONTHLY: ${{ github.event.inputs.enviar_pase }}
      - run: node scripts/prospects.mjs
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SEND_PROSPECTS: ${{ github.event.inputs.enviar_prospectos }}
      - run: node scripts/ban-zones.mjs
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_SEND_BAN_ZONES: ${{ github.event.inputs.enviar_zonas_ban }}
      - name: Commit si hay cambios
        run: |
          git config user.name "bitacora-bot"
          git config user.email "bitacora-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "Sin cambios en data/"
            exit 0
          fi
          git commit -m "Datos actualizados $(date -u +%FT%TZ)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "Push rechazado, reintento $i…"
            sleep $((i * 3))
          done
          echo "No se pudo pushear tras rebase"
          exit 1
      - uses: actions/upload-pages-artifact@v4
        with: { path: "." }
      # Pages a veces responde 500 transitorio; un reintento evita re-run manual.
      - name: Deploy to GitHub Pages
        id: pages
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Esperar antes de reintentar Pages
        if: steps.pages.outcome == 'failure'
        run: sleep 45
      - name: Deploy to GitHub Pages (reintento)
        if: steps.pages.outcome == 'failure'
        uses: actions/deploy-pages@v5
