name: Actualizar bitácora
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["index.html", "data/prospects.json", "data/legacy-wars.json", "scripts/**"]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: bitacora, cancel-in-progress: false }
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node --test tests/
      - run: node scripts/fetch.mjs
        env:
          COC_API_TOKEN: ${{ secrets.COC_API_TOKEN }}
          CLAN_TAG: "#2RGC02RYC"
      - run: node scripts/build.mjs
      - name: Commit si hay cambios
        run: |
          git config user.name "bitacora-bot"
          git config user.email "bitacora-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Datos actualizados $(date -u +%FT%TZ)" && git push
      - uses: actions/upload-pages-artifact@v3
        with: { path: "." }
      - uses: actions/deploy-pages@v4
